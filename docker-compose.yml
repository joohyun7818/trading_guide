version: '3.8'

services:
  alphaflow-v2-db:
    image: postgres:15
    container_name: alphaflow-v2-db
    profiles: ["db"]
    environment:
      POSTGRES_USER: alphaflow
      POSTGRES_PASSWORD: alphaflow123
      POSTGRES_DB: alphaflow_us
    ports:
      - "5432:5432"
    volumes:
      - pgdata_v2:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphaflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata_v2:
    driver: local
